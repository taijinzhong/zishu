/* 语音：优先用系统语音；浏览器没有语音时，改走在线发音兜底 */
const HAS_TTS = !!(window.speechSynthesis && window.SpeechSynthesisUtterance);
/* 手机上（微信/华为浏览器）系统语音常常"有对象但不发声"，一律改走在线发音 */
const IS_MOBILE = /Android|iPhone|iPad|iPod|HarmonyOS|Mobile/i.test(navigator.userAgent || "");
function zhVoiceList(){
  try{ return (speechSynthesis.getVoices() || []).filter(function(v){ return /zh|cmn/i.test(v.lang || "") || /chinese|中文|普通话/i.test(v.name || ""); }); }catch(e){ return []; }
}
function useSystemTTS(){ return HAS_TTS && !IS_MOBILE && zhVoiceList().length > 0; }
(function unlockAudio(){
  var done = false;
  var silent = "data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA";
  function un(){ if(done) return; done = true; try{ var a = new Audio(silent); a.volume = 0.01; var p = a.play(); if(p && p.catch){ p.catch(function(){}); } }catch(e){} }
  document.addEventListener("touchstart", un, { once: true, passive: true });
  document.addEventListener("click", un, { once: true });
})();
let ttsAudio = null;
function onlineSpeak(text, onEnd){
  try{
    if(!ttsAudio){
      ttsAudio = document.createElement("audio");
      ttsAudio.setAttribute("playsinline", "");
      ttsAudio.preload = "auto";
      document.body.appendChild(ttsAudio);
    }
    try{ ttsAudio.pause(); }catch(e){}
    ttsAudio.onended = function(){ if(onEnd) onEnd(); };
    ttsAudio.onerror = function(){ if(onEnd) onEnd(); };
    ttsAudio.src = "https://fanyi.baidu.com/gettts?lan=zh&spd=2&source=web&text=" + encodeURIComponent(text);
    ttsAudio.volume = 1.0;
    var p = ttsAudio.play();
    if(p && p.catch){ p.catch(function(){ if(onEnd) onEnd(); }); }
  }catch(e){ if(onEnd) onEnd(); }
}
function say(text){
  if(useSystemTTS()){
    try{
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang="zh-CN"; u.rate=0.85; u.pitch=1.0;
      if(ZH_VOICE) u.voice = ZH_VOICE;
      speechSynthesis.speak(u);
      return;
    }catch(e){}
  }
  onlineSpeak(text);
}

/* 串读：先把待读的几段排成队，读完一段接下一段 */
let speakQ = [], speakTimer = null;
function speakQueue(list){
  clearTimeout(speakTimer);
  if(useSystemTTS()){ try{ speechSynthesis.cancel(); }catch(e){} }
  speakQ = list.slice();
  nextSpeak();
}
function nextSpeak(){
  if(!speakQ.length) return;
  const t = speakQ.shift();
  const nxt = function(){ speakTimer = setTimeout(nextSpeak, 240); };
  if(useSystemTTS()){
    try{
      const u = new SpeechSynthesisUtterance(t);
      u.lang = "zh-CN"; u.rate = 0.86; u.pitch = 1.0;
      if(ZH_VOICE) u.voice = ZH_VOICE;
      u.onend = nxt; u.onerror = nxt;
      speechSynthesis.speak(u);
      return;
    }catch(e){}
  }
  onlineSpeak(t, nxt);
}

/* 一个字：字 → 三个词 → 例句 */
function readChar(ch, d){
  const plain = d.j.replace(/<[^>]+>/g, "");
  speakQueue([ch, d.w.join("，"), plain]);
}

/* 跟读：用浏览器语音识别听孩子读 */
function listenChar(ch){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ tip("这个浏览器没有麦克风识别，先用「整段读一遍」跟着读"); return; }
  try{ speechSynthesis.cancel(); }catch(e){}
  const r = new SR();
  r.lang = "zh-CN"; r.interimResults = false; r.maxAlternatives = 3;
  let done = false;
  r.onresult = (e)=>{
    done = true;
    const alts = Array.from(e.results[0]).map(x=>x.transcript.replace(/\s|，|。|、/g,""));
    const hit = alts.some(t => t.indexOf(ch) >= 0 || ch.indexOf(t) >= 0);
    if(hit){ praise(); } else { tip("听到「" + alts[0] + "」，再读一遍试试"); }
  };
  r.onerror = ()=>{ if(!done) tip("没听清，凑近一点再说一次"); };
  r.onend = ()=>{};
  try{ r.start(); }catch(e){ tip("麦克风打不开，检查一下权限"); return; }
  tip("请读这个字…");
  setTimeout(()=>{ try{ r.stop(); }catch(e){} }, 4500);
}
function praise(){
  const w = ["宝贝真棒！","读得真准，宝贝真棒！","太好了，宝贝真棒！","宝贝真棒，再来一个！"];
  const s = w[Math.floor(Math.random()*w.length)];
  say(s); tip(s);
}

/* 满分撒花：一把纸片从天而降，两秒后自己清掉 */
function confetti(){
  const box = document.createElement("div");
  box.style.cssText = "position:fixed;left:0;top:0;right:0;bottom:0;pointer-events:none;z-index:99;overflow:hidden";
  document.body.appendChild(box);
  const cs = ["#f2c14e","#e88b8b","#7fc4a2","#8bb2e8","#d9a7e0","#f0a875","#f6d365"];
  const H = window.innerHeight || 700;
  for(let i=0;i<56;i++){
    const p = document.createElement("div");
    const sz = 20 + Math.random()*24;   /* 花瓣放大三倍 */
    p.style.cssText = "position:absolute;top:-24px;left:" + (Math.random()*100) +
      "%;width:" + sz + "px;height:" + (sz*0.74) + "px;background:" + cs[i % cs.length] + ";border-radius:46% 54% 50% 50%/62% 58% 42% 38%";
    box.appendChild(p);
    p.animate([
      { transform:"translate(0,0) rotate(0deg)", opacity:1 },
      { transform:"translate(" + ((Math.random()*2-1)*130) + "px," + (H*0.92) + "px) rotate(" +
        (360 + Math.random()*400) + "deg)", opacity:0.85 }
    ], { duration: 1300 + Math.random()*900, easing:"cubic-bezier(.25,.6,.5,1)", fill:"forwards" });
  }
  setTimeout(function(){ box.remove(); }, 2400);
}

/* ============ 描红时的背景轻音乐 ============ */
/* 用 Web Audio 现场合成，不依赖任何外部音频文件 */
let actx = null, musicOn = false, musicTimer = null, birdTimer = null, master = null, revNodes = null;
/* 默认不放音乐，嫌吵就不用管它；要点才按「♫ 音乐关」打开 */
let melIdx = 0;

/* 儿歌轮着弹：《卖报歌》→《两只老虎》→《小星星》→ 回头再来，配低音伴奏 */
const C3 = 130.81, F3 = 174.61, G3 = 196.00;
const C4 = 261.63, D4 = 293.66, E4 = 329.63, F4 = 349.23;
const G4 = 392.00, A4 = 440.00, B4 = 493.88, C5 = 523.25, D5 = 587.33;

/* [频率, 时长, 低音(0 或频率)] */
const MELODY = [
  /* 卖报歌（聂耳曲，作者 1935 年去世，早已进入公有领域） */
  [C5,0.22,F3],[C5,0.22],[C5,0.26],[0,0.06],
  [C5,0.22],[C5,0.22],[C5,0.26],[0,0.10],
  [A4,0.22],[C5,0.22],[D5,0.22],[C5,0.22],[A4,0.24],[0,0.06],
  [G4,0.22],[A4,0.22],[C5,0.28],[0,0.12],
  [C5,0.22,G3],[A4,0.22],[C5,0.22],[A4,0.22],[G4,0.26],[0,0.06],
  [F4,0.22],[A4,0.22],[G4,0.26],[0,0.06],
  [A4,0.22],[A4,0.22],[G4,0.26],[0,0.12],
  [C5,0.22,F3],[C5,0.22],[C5,0.24],[A4,0.22],[C5,0.22],[C5,0.24],[0,0.06],
  [C5,0.22],[A4,0.22],[G4,0.22],[C5,0.30],[0,0.14],
  [C5,0.22,G3],[A4,0.22],[G4,0.22],[A4,0.22],[0,0.06],
  [C5,0.22],[A4,0.22],[G4,0.22],[A4,0.22],[0,0.06],
  [C4,0.22,F3],[F4,0.22],[G4,0.22],[A4,0.24],[0,0.06],
  [F4,0.30],[0,0.45],
  /* 两只老虎 */
  [C4,0.28,C3],[D4,0.28],[E4,0.28],[C4,0.28],[0,0.10],
  [C4,0.28],[D4,0.28],[E4,0.28],[C4,0.28],[0,0.10],
  [E4,0.28],[F4,0.28],[G4,0.30],[0,0.12],
  [E4,0.28],[F4,0.28],[G4,0.30],[0,0.12],
  [G4,0.26],[A4,0.26],[G4,0.26],[F4,0.26],[E4,0.26],[C4,0.28],[0,0.12],
  [G4,0.26],[A4,0.26],[G4,0.26],[F4,0.26],[E4,0.26],[C4,0.28],[0,0.12],
  [C4,0.28,C3],[G3,0.28,0],[C4,0.30],[0,0.12],
  [C4,0.28,0],[G3,0.28,0],[C4,0.30],[0,0.42],
  /* 小星星 */
  [C4,0.32,C3],[C4,0.32],[G4,0.32],[G4,0.32],[A4,0.32],[A4,0.32],[G4,0.42],[0,0.10],
  [F4,0.32],[F4,0.32],[E4,0.32],[E4,0.32],[D4,0.32],[D4,0.32],[C4,0.42],[0,0.12],
  [G4,0.32,G3],[G4,0.32],[F4,0.32],[F4,0.32],[E4,0.32],[E4,0.32],[D4,0.42],[0,0.10],
  [G4,0.32,0],[G4,0.32],[F4,0.32],[F4,0.32],[E4,0.32],[E4,0.32],[D4,0.42],[0,0.12],
  [C4,0.32,C3],[C4,0.32],[G4,0.32],[G4,0.32],[A4,0.32],[A4,0.32],[G4,0.42],[0,0.10],
  [F4,0.32],[F4,0.32],[E4,0.32],[E4,0.32],[D4,0.32],[D4,0.32],[C4,0.46],[0,0.55]
];

function playNote(f, dur, t0, vol, bass){
  if(!f || !master) return;
  /* 钢琴味：正弦打底，叠两层很弱的泛音，起音柔、尾巴自然拖出去 */
  const partials = [[1, 1], [2, 0.20], [3, 0.07]];
  for(const [mul, amp] of partials){
    const o = actx.createOscillator();
    const g = actx.createGain();
    o.type = "sine";
    o.frequency.setValueAtTime(f*mul, t0);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(vol*amp, t0 + 0.055);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur*1.15);
    o.connect(g); g.connect(master);
    o.start(t0); o.stop(t0 + dur*1.15 + 0.06);
  }
  /* 低音伴奏：每个乐句头上垫一个，听着才像有伴奏的歌 */
  if(bass){
    const ob = actx.createOscillator();
    const gb = actx.createGain();
    ob.type = "sine";
    ob.frequency.setValueAtTime(bass, t0);
    gb.gain.setValueAtTime(0.0001, t0);
    gb.gain.linearRampToValueAtTime(0.05, t0 + 0.12);
    gb.gain.exponentialRampToValueAtTime(0.0001, t0 + dur*2.4);
    ob.connect(gb); gb.connect(master);
    ob.start(t0); ob.stop(t0 + dur*2.4 + 0.06);
  }
}

/* 一声鸟叫：先上扬再回落，短促 */
function birdChirp(){
  if(!actx || !musicOn || !master) return;
  const t = actx.currentTime + 0.05;
  const f0 = 2100 + Math.random()*1400;
  const o = actx.createOscillator();
  const g = actx.createGain();
  o.type = "sine";
  o.frequency.setValueAtTime(f0, t);
  o.frequency.exponentialRampToValueAtTime(f0*1.55, t + 0.07);
  o.frequency.exponentialRampToValueAtTime(f0*1.12, t + 0.17);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(0.09, t + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.21);
  o.connect(g); g.connect(master);
  o.start(t); o.stop(t + 0.26);
}

function scheduleMelody(){
  if(!actx || !musicOn || !master) return;
  let t = actx.currentTime + 0.08;
  for(let k = 0; k < MELODY.length; k++){
    const [f, d, b] = MELODY[melIdx % MELODY.length];
    if(f) playNote(f, d*0.9, t, 0.11, b);
    t += d;
    melIdx++;
  }
  const span = (t - actx.currentTime) - 0.2;
  musicTimer = setTimeout(scheduleMelody, Math.max(600, span*1000));
}

function birdLoop(){
  if(!musicOn) return;
  birdChirp();
  if(Math.random() < 0.45) setTimeout(birdChirp, 210);
  birdTimer = setTimeout(birdLoop, 1700 + Math.random()*3200);
}

function musicStart(){
  if(!musicOn) return;
  const a = document.getElementById("bgm");
  if(!a){ bindUnlock(); return; }
  try{
    a.volume = 0.08;
    const p = a.play();
    if(p && p.then){ p.catch(function(){ bindUnlock(); }); }   /* 被浏览器拦了，等第一次点 */
  }catch(e){ bindUnlock(); }
}
function musicStop(){
  const a = document.getElementById("bgm");
  if(a){ try{ a.pause(); a.currentTime = 0; }catch(e){} }
  clearTimeout(musicTimer); musicTimer = null;
  clearTimeout(birdTimer);  birdTimer  = null;
}
function bindMusicToggle(){
  const el = document.getElementById("mtog");
  if(!el) return;
  el.textContent = musicOn ? "♪ 音乐" : "♪ 静音";
  el.onclick = ()=>{
    musicOn = !musicOn;
    el.textContent = musicOn ? "♪ 音乐" : "♪ 静音";
    if(musicOn) musicStart(); else musicStop();
    try{ localStorage.setItem("zs_music", musicOn ? "1" : "0"); }catch(e){}
    setTopMusic();
  };
}

/* ============ 描红 · 画布 ============ */
let pad, pctx, W=0, H=0, drawing=false, last=null, maskRatio=0, maskData=null;

function initPad(ch){
  pad = document.getElementById("pad");
  const dprIn = window.devicePixelRatio || 1;
  const cssW = pad.clientWidth || 300;
  const px = Math.round(cssW * dprIn);
  pad.width = px; pad.height = px;
  W = px; H = px;
  pctx = pad.getContext("2d");
  pad.style.pointerEvents = "";

  // 田字格
  pctx.clearRect(0,0,W,H);
  pctx.strokeStyle = "#cfe0e6"; pctx.lineWidth = Math.max(1, W*0.006);
  pctx.setLineDash([]);
  pctx.strokeRect(W*0.04, H*0.04, W*0.92, H*0.92);
  pctx.setLineDash([W*0.03, W*0.035]);
  pctx.beginPath();
  pctx.moveTo(W*0.5, H*0.04); pctx.lineTo(W*0.5, H*0.96);
  pctx.moveTo(W*0.04, H*0.5); pctx.lineTo(W*0.96, H*0.5);
  pctx.stroke(); pctx.setLineDash([]);

  // 灰字（描红底）
  pctx.fillStyle = "#d8d3c6";
  pctx.font = `${Math.round(W*0.70)}px KaiTi, 楷体, "Noto Serif SC", serif`;
  pctx.textAlign = "center"; pctx.textBaseline = "middle";
  pctx.fillText(ch, W*0.5, H*0.53);

  // 生成字形 mask（从离屏黑字取）
  const off = document.createElement("canvas");
  off.width = W; off.height = H;
  const oc = off.getContext("2d");
  oc.fillStyle = "#000";
  oc.font = pctx.font;
  oc.textAlign = "center"; oc.textBaseline = "middle";
  oc.fillText(ch, W*0.5, H*0.53);
  const od = oc.getImageData(0,0,W,H).data;
  maskData = new Uint8Array(W*H);
  maskRatio = 0;
  for(let i=0, j=0; i<W*H; i++, j+=4){
    const a = od[j+3];
    if(a > 110){ maskData[i] = 1; maskRatio++; }
  }
  if(maskRatio === 0) maskRatio = 1;

  document.getElementById("pct").textContent = "0%";
  // 画布事件
  pad.onpointerdown = (e)=>{
    drawing = true; last = pos(e);
    musicStart();                 /* 落笔就有琴声，写起来不闷 */
    pad.setPointerCapture?.(e.pointerId);
    dot(last);
  };
  pad.onpointermove = (e)=>{
    if(!drawing) return;
    const p = pos(e);
    pctx.strokeStyle = "#2b2620";
    pctx.lineWidth = Math.max(2, W*0.062);
    pctx.lineCap = "round"; pctx.lineJoin = "round";
    pctx.beginPath(); pctx.moveTo(last.x, last.y); pctx.lineTo(p.x, p.y); pctx.stroke();
    last = p; updatePct();
  };
  pad.onpointerup = pad.onpointercancel = ()=>{ drawing = false; last = null; };
  document.getElementById("clear").onclick = ()=>{ initPad(document.getElementById("pad").dataset.ch || ch); };
  document.getElementById("check").onclick = ()=> checkPad(ch);
  pad.dataset.ch = ch;
}

function pos(e){
  const r = pad.getBoundingClientRect();
  const sc = pad.width / r.width;
  return { x:(e.clientX - r.left)*sc, y:(e.clientY - r.top)*sc };
}
function dot(p){
  pctx.fillStyle="#2b2620";
  pctx.beginPath();
  pctx.arc(p.x, p.y, Math.max(1.5, W*0.031), 0, Math.PI*2);
  pctx.fill();
}

/* 覆盖率：笔迹落在字形区域内的比例 */
/* 覆盖率：笔迹落在字形区域内的比例；顺带检查四角是否被涂满 */
function coverage(){
  const d = pctx.getImageData(0,0,W,H).data;
  let ink=0, hit=0;
  for(let i=0, j=0; i<W*H; i++, j+=4){
    const a = d[j+3];
    if(a < 40){ continue; }              // 透明像素不算笔迹（透明区 RGB 是 0，会被误判成黑）
    const lum = 0.299*d[j] + 0.587*d[j+1] + 0.114*d[j+2];
    if(lum < 110){
      ink++;
      if(maskData[i]) hit++;
    }
  }
  // 四角抽样：字形不占四角，四角都黑说明是在涂格子
  const boxW = Math.round(W*0.16);
  const corners = [[0,0],[W-boxW,0],[0,H-boxW],[W-boxW,H-boxW]];
  let hot = 0;
  for(const [ox,oy] of corners){
    let cnt=0, tot=0;
    for(let y=oy; y<oy+boxW; y+=3){
      for(let x=ox; x<ox+boxW; x+=3){
        tot++;
        const j=(Math.round(y)*W + Math.round(x))*4;
        if(d[j+3] < 40) continue;
        const lum = 0.299*d[j] + 0.587*d[j+1] + 0.114*d[j+2];
        if(lum < 110) cnt++;
      }
    }
    if(tot && cnt/tot > 0.22) hot++;
  }
  return { ratio: hit / maskRatio, ink: ink / (W*H), maskFrac: maskRatio / (W*H), hot };
}
function updatePct(){
  const c = coverage();
  const el = document.getElementById("pct");
  if(el) el.textContent = Math.min(100, Math.round(c.ratio*100)) + "%";
}
function checkPad(ch){
  if(pian >= 3) return;   /* 三遍已满，不再重复计 */
  const c = coverage();
  let stars = 0;
  if(c.ratio >= 0.62) stars = 3;
  else if(c.ratio >= 0.40) stars = 2;
  else if(c.ratio >= 0.16) stars = 1;

  // 防乱涂：不看笔迹多少，看有没有把格子四角都涂黑
  const scribble = c.hot >= 3;
  if(scribble) stars = Math.min(stars, 1);

  if(stars > (S.stars[ch]||0)){ S.stars[ch] = stars; }
  save();
  const el = document.getElementById("stars");
  if(el) el.innerHTML = starStr(S.stars[ch]||0);
  updatePct();

  if(stars === 0){ tip("还没描到字上，贴着灰笔画慢慢走"); return; }
  if(scribble){ tip("别把格子涂满，要一笔一笔贴着字描"); return; }

  /* 这一遍算过关 */
  pian++;
  const mt = document.getElementById("mtxt");
  const gained = pian === 1 ? 30 : (pian === 2 ? 60 : 100);
  const sc = document.getElementById("score");
  if(sc){ sc.textContent = "得分 " + gained + " 分"; popScore(sc); }
  if(pian >= 3){
    S.done[ch] = true; save();
    if(mt) mt.textContent = "三遍都写好了";
    if(sc){ sc.textContent = "得分 100 分"; popScore(sc); }
    pad.style.pointerEvents = "none";
    confetti();
    say(stars === 3 ? "一百分！三遍都写对了，宝贝真棒！" : "一百分！三遍都写完了，宝贝真棒！");
    tip("满分！这个字归你了");
    return;
  }
  if(mt) mt.textContent = `第 ${pian+1} 遍 · 共 3 遍`;
  if(stars === 3){ say("宝贝真棒！"); tip("写得像，再写一遍"); }
  else { tip("这一遍过了，再写一遍会更好"); }
  initPad(ch);   /* 清空格子，接着描下一遍 */
}

/* ============ 游戏题 ============ */
let qi = 0, qTotal = 0, qChars = [];

function startQuiz(){
  view="quiz"; qi = 0;
  qChars = G[gi].c.slice(0, Math.min(3, G[gi].c.length));
  qTotal = qChars.length;
  nextQ();
}

function nextQ(){
  if(qi >= qTotal){ finishGroup(); return; }
  const target = qChars[qi];
  const all = [];
  G.forEach(g=>g.c.forEach(c=>{ if(!all.includes(c)) all.push(c); }));
  const pool = all.filter(c=>c!==target).sort(()=>Math.random()-.5).slice(0,3);
  const opts = [target, ...pool].sort(()=>Math.random()-.5);

  titleEl.textContent = "小游戏";
  subEl.textContent = `第 ${qi+1} / ${qTotal} 题`;
  stage.innerHTML = `
    <div class="card quiz">
      <div class="qt">听一听，找出这个字</div>
      <div class="qh">点喇叭可以再听一遍</div>
      <div style="margin:6px 0 16px"><button class="btn say" id="play" style="max-width:180px;margin:0 auto;display:block">🔊 再听一遍</button></div>
      <div class="opts">${opts.map(o=>`<button class="opt" data-c="${o}">${o}</button>`).join("")}</div>
    </div>`;
  setTimeout(()=>say(target), 220);
  document.getElementById("play").onclick = ()=> say(target);
  stage.querySelectorAll(".opt").forEach(btn=>{
    btn.onclick = ()=>{
      const ok = btn.dataset.c === target;
      btn.classList.add(ok ? "right" : "wrong");
      if(ok){ say("对了"); setTimeout(()=>{ qi++; nextQ(); }, 650); }
      else { say("再听听"); setTimeout(()=>btn.classList.remove("wrong"), 500); }
    };
  });
}

function finishGroup(){
  const g = G[gi];
  titleEl.textContent = g.n;
  subEl.textContent = "这一课完成";
  stage.innerHTML = `
    <div class="card quiz">
      <div style="font-size:40px;margin:6px 0 4px">${g.c.join("")}</div>
      <div class="qt">这一组写完啦</div>
      <div class="qh">${g.c.join("　")}</div>
      <div class="row">
        <button class="btn ghost" id="again">再练一遍</button>
        <button class="btn next" id="home">回目录</button>
      </div>
    </div>`;
  say("这一组写完啦，真棒");
  document.getElementById("again").onclick = ()=>{ ci=0; renderCard(); };
  document.getElementById("home").onclick = ()=> renderHome();
}

/* ============ 背景音乐开关 · 语音选择 ============ */
const musEl = document.getElementById("mus");
const mus2El = document.getElementById("mus2");
let ZH_VOICE = null, unlockBound = false;

function setTopMusic(){
  if(!musEl) return;
  musEl.textContent = musicOn ? "♫ 音乐开" : "♫ 音乐关";
  musEl.classList.toggle("off", !musicOn);
}
function bindUnlock(){
  if(unlockBound) return;
  unlockBound = true;
  const kick = ()=>{
    document.removeEventListener("pointerdown", kick, true);
    document.removeEventListener("keydown", kick, true);
    unlockBound = false;
    if(musicOn) musicStart();
  };
  document.addEventListener("pointerdown", kick, true);
  document.addEventListener("keydown", kick, true);
}
if(musEl) musEl.onclick = ()=>{
  musicOn = !musicOn;
  try{ localStorage.setItem("zs_music", musicOn ? "1" : "0"); }catch(e){}
  setTopMusic();
  if(musicOn){ musicStart(); } else { musicStop(); }
  bindMusicToggle();
  tip(musicOn ? "音乐开了" : "音乐关了");
};

function pickVoice(){
  try{
    const vs = speechSynthesis.getVoices() || [];
    const zh = vs.filter(v=>/zh|cmn/i.test(v.lang||"") || /chinese/i.test(v.name||""));
    let saved = null;
    try{ saved = localStorage.getItem("zs_voice"); }catch(e){}
    if(saved){
      const hit = zh.find(v=>v.name === saved);
      if(hit){ ZH_VOICE = hit; return; }
    }
    const order = ["Xiaoxiao","Xiaoyi","Xiaohan","Huihui","Yaoyao","Tingting","Kangkang","Yunyang"];
    for(const k of order){
      const hit = zh.find(v=>v.name.indexOf(k) >= 0);
      if(hit){ ZH_VOICE = hit; return; }
    }
    if(zh.length) ZH_VOICE = zh[0];
  }catch(e){}
}
function trySpeak(text){
  try{
    if(!window.speechSynthesis) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "zh-CN"; u.rate = 0.88; u.pitch = 1.0;
    if(ZH_VOICE) u.voice = ZH_VOICE;
    speechSynthesis.speak(u);
  }catch(e){}
}
function openVoice(){
  const has = HAS_TTS;
  const vs = has ? zhVoiceList() : [];
  const cur = ZH_VOICE ? ZH_VOICE.name : "";
  const box = document.createElement("div");
  box.className = "vpanel";
  box.innerHTML = '<div class="vbox">'
    + '<h3>朗读声音</h3>'
    + (has
        ? '<p>点一下试读。想要更自然的女声，到系统「设置 → 时间和语言 → 语音」里添加「中文（简体）」的晓晓，装好刷新本页，这里就能选到。</p>'
          + (vs.length
              ? vs.map((v,i)=>'<button class="vopt ' + (v.name===cur?"on":"") + '" data-i="' + i + '">' + v.name + '</button>').join("")
              : '<p style="color:#c4553f">这台设备还没装中文语音，去系统设置里添一个。</p>')
        : '<p style="color:#c4553f">这个浏览器没有内置朗读，已自动改用「在线发音」，连着网就能读。</p><button class="vopt" id="vtest" style="text-align:center">试听一句</button>')
    + '<button class="vopt" id="vclose" style="text-align:center;color:#9a9287">关闭</button>'
    + '</div>';
  document.body.appendChild(box);
  box.onclick = (e)=>{ if(e.target === box) box.remove(); };
  document.getElementById("vclose").onclick = ()=> box.remove();
  const vtest = document.getElementById("vtest");
  if(vtest) vtest.onclick = ()=> say("春天来了，小草绿了。");
  box.querySelectorAll(".vopt[data-i]").forEach(b=>{
    b.onclick = ()=>{
      ZH_VOICE = vs[+b.dataset.i];
      try{ localStorage.setItem("zs_voice", ZH_VOICE.name); }catch(e){}
      box.querySelectorAll(".vopt").forEach(x=>x.classList.remove("on"));
      b.classList.add("on");
      trySpeak("春天来了，小草绿了。");
    };
  });
}
if(mus2El) mus2El.onclick = openVoice;
if(window.speechSynthesis){
  pickVoice();
  speechSynthesis.onvoiceschanged = pickVoice;
}

/* 支持 #g1c2 直接进某组某字（也方便截图与分享） */
(function boot(){
  if(location.hash.indexOf("cert") >= 0){ renderCert(); return; }
  const m = location.hash.match(/^#g(\d+)c(\d+)/);
  if(m && G[+m[1]]){
    gi = Math.min(+m[1], G.length-1);
    ci = Math.min(+m[2], G[gi].c.length-1);
    renderCard();
  } else { renderHome(); }
  if(location.hash.indexOf("selftest") >= 0) selfTest();
  window.addEventListener("load", function(){
    setTopMusic();
    if(musicOn) musicStart();
  });
})();

/* 自检钩子：URL 带 #...selftest 时沿字形描一遍，用于核对判定算法 */
function selfTestPaint(){
  if(!maskData) return;
  const r = W*0.031;
  pctx.fillStyle = "#2b2620";
  const step = W*0.018;
  for(let y=0; y<H; y+=step){
    for(let x=0; x<W; x+=step){
      const i = Math.round(y)*W + Math.round(x);
      if(maskData[i]){
        pctx.beginPath(); pctx.arc(x, y, r, 0, Math.PI*2); pctx.fill();
      }
    }
  }
}
function selfTest(){
  selfTestPaint();
  const c = coverage();
  tip("自检：覆盖 " + Math.round(c.ratio*100) + "% · 四角 " + c.hot + " · 笔迹 " + Math.round(c.ink*100) + "%");
  updatePct();
}
</script>
